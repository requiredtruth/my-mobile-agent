plugins { id 'com.android.application' }
android {
 namespace 'com.mobileagent'
 compileSdk 35
 ndkVersion '28.0.13004108'
 defaultConfig {
  applicationId 'com.mobileagent'; minSdk 26; targetSdk 35
  versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger(); versionName '1.0.0'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  ndk { abiFilters 'arm64-v8a', 'x86_64' }
  externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.31.6' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { release { storeFile rootProject.file('release.keystore'); storePassword 'mobile-agent-release'; keyAlias 'mobile-agent'; keyPassword 'mobile-agent-release' } }
 buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
 packaging { jniLibs { useLegacyPackaging false } }
}

dependencies { androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }
